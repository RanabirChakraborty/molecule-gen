[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molecule-gen"
version = "1.0.0"
description = "MCP server for AI-assisted Molecule scenario generation in Ansible Middleware collections"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "yamllint>=1.26",
    "ansible-lint>=6.0",
]

[project.scripts]
molecule-gen     = "mcp_molecule.server:main"
molecule-gen-scan = "mcp_molecule.cli:main"

[project.urls]
Repository = "https://github.com/ansible-middleware/molecule-gen"
Homepage   = "https://github.com/ansible-middleware/molecule-gen#readme"

[tool.hatch.build.targets.wheel]
packages = ["mcp_molecule"]
